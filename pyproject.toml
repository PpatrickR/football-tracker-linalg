[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-tracker"
version = "0.0.1"
description = "Open-source 22-man football vision: field-coord-native, era-invariant."
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "transformers>=4.40",
    "supervision>=0.20",
    "opencv-python>=4.9",
    "pillow",
    "numpy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
